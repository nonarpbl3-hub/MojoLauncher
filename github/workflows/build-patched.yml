diff -ruN -x '*.orig' -x '*.new' orig/MojoLauncher-3_openjdk/.github/workflows/android-lite.yml MojoLauncher-3_openjdk/.github/workflows/android-lite.yml
--- a/MojoLauncher-3_openjdk/.github/workflows/android-lite.yml	1970-01-01 00:00:00.000000000 +0000
+++ b/.github/workflows/android-lite.yml	2026-10-15 04:37:12.039636762 +0000
@@ -0,0 +1,33 @@
+name: Android CI (lite)
+
+on:
+  push:
+  workflow_dispatch:
+
+jobs:
+  build:
+    runs-on: ubuntu-22.04
+    steps:
+      - name: Checkout
+        uses: actions/checkout@v4
+        with:
+          submodules: recursive
+
+      - uses: gradle/actions/setup-gradle@v4
+        with:
+          gradle-version: "8.14.5"
+
+      - name: Set up JDK 17
+        uses: actions/setup-java@v4
+        with:
+          distribution: 'temurin'
+          java-version: '17'
+
+      - name: Build optimized APK (minified, not debuggable)
+        run: gradle :app_mojo:assembleFullProguardNoDebug
+
+      - name: Upload APK
+        uses: actions/upload-artifact@v4
+        with:
+          name: launcher-apk
+          path: app_mojo/build/outputs/apk/full/proguardNoDebug/*.apk
