+    /**
+     * Default GC and runtime tuning for Java 8 games. Skipped for any option the user already set.
+     * IgnoreUnrecognizedVMOptions keeps the VM alive if a build of the runtime lacks a flag.
+     */
+    private static void addPerformanceDefaults(List<String> args) {
+        boolean userGc = false;
+        for(String arg : args) {
+            if(arg.startsWith("-XX:+Use") && arg.endsWith("GC")) {
+                userGc = true;
+                break;
+            }
+        }
+        args.add(0, "-XX:+IgnoreUnrecognizedVMOptions");
+        if(!userGc) {
+            if(LauncherPreferences.PREF_RAM_ALLOCATION <= 2048) {
+                // Small heap: no GC worker threads competing with the render thread
+                args.add("-XX:+UseSerialGC");
+                args.add("-XX:NewRatio=1");
+            } else {
+                args.add("-XX:+UseG1GC");
+                args.add("-XX:MaxGCPauseMillis=40");
+            }
+        }
+        args.add("-XX:+DisableExplicitGC");
+        args.add("-XX:-UsePerfData");
+        args.add("-XX:ReservedCodeCacheSize=128m");
+        args.add("-Djava.net.preferIPv4Stack=true");
+    }
+
     private static File getVmPath(File runtimeHomeDir, String arch, String flavor) {
         if(arch != null) return new File(runtimeHomeDir, "lib/"+arch+"/"+flavor+"/libjvm.so");
         else return new File(runtimeHomeDir, "lib/"+flavor+"/libjvm.so");
